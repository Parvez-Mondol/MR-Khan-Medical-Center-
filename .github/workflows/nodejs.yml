name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:ci
        env:
          CI: true
          ENFORCE_COVERAGE: true

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests (mongodb-memory-server)
        run: |
          # Run tests, capture output and preserve exit code
          npm run test:ci 2>&1 | tee test-output.txt
          test_exit=${PIPESTATUS[0]}
          echo "TEST_EXIT=$test_exit" > test-exit.txt
          exit $test_exit
        env:
          CI: true
          RUN_INTEGRATION: true
          ENFORCE_COVERAGE: true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: |
            test-output.txt
            test-exit.txt
            coverage/**
            coverage/lcov.info
