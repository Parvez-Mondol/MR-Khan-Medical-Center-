services:
  # Development override: mount source, run dev server with nodemon
  app:
    image: node:18
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app:delegated
      - /usr/src/app/node_modules
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/khan_medical_center
      - NODE_ENV=development
    depends_on:
      - mongo
    command: sh -c "npm ci && npm run dev"
  frontend:
    image: node:18
    working_dir: /usr/src/frontend
    volumes:
      - ./frontend:/usr/src/frontend:delegated
      - /usr/src/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://host.docker.internal:5000
    command: sh -c "cd /usr/src/frontend && npm ci && npm run dev"
